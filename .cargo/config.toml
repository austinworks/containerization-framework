# The Swift runtime this crate links against is dynamic and referenced as
# `@rpath/libswift_Concurrency.dylib`, so every binary that links it —
# including this crate's own test binaries — needs this rpath or dies in dyld
# at launch. A rustflag reaches every target rustc builds, so the rpath is set
# there; a build script also emitting it would draw
# `ld: duplicate -rpath ignored`.
#
# rustdoc doesn't read rustflags, so the doctests' merged binary gets the
# rpath from rustdocflags instead. Cargo reads those only under `[build]`, not
# per target, and the flag is harmless on other platforms.
#
# This file covers builds of this repository only. A crate depending on
# `containerization-framework` needs the same rustflag in its own
# `.cargo/config.toml`.
[target.'cfg(target_os = "macos")']
rustflags = ["-C", "link-arg=-Wl,-rpath,/usr/lib/swift"]

[build]
rustdocflags = ["-C", "link-arg=-Wl,-rpath,/usr/lib/swift"]
